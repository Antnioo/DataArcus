# GitHub checks the packages the site, the MCP and the workflows use, and proposes updates for security problems.
# Minor and patch updates come grouped, one pull request per folder each week (16 Oct: four single PRs conflicted with
# each other in package-lock.json). A major update still comes alone, since it can break things; security updates
# stay one per problem.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      site-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/mcp"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      mcp-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
