name: Check exam skills outlines (DP-600, PL-300)

on:
  schedule:
    - cron: '15 5 * * 1'  # every Monday 05:15 UTC (09:15 Dubai), just after the price check
  workflow_dispatch:       # "Run workflow" button for a manual check

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  check-outlines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Read Microsoft's DP-600 study guide
        id: dp600
        run: node scripts/check-exam-outline.mjs dp-600
        continue-on-error: true

      - name: Read Microsoft's PL-300 study guide
        id: pl300
        run: node scripts/check-exam-outline.mjs pl-300
        continue-on-error: true

      # main is protected (pull requests with passing checks only), so the bot opens a pull request and starts the
      # checks on it itself (a pull request opened by this token starts no workflows on its own); the owner merges it
      - name: Propose the check dates (a pull request)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet assets/data/dp600-outline.json assets/data/pl300-outline.json; then
            echo "No changes"
          else
            DAY=$(date -u +%Y-%m-%d)
            BRANCH="bot/exam-outlines-$DAY-${{ github.run_id }}"
            git config user.name "DataArcus exam bot"
            git config user.email "actions@users.noreply.github.com"
            git switch -c "$BRANCH"
            git add assets/data/dp600-outline.json assets/data/pl300-outline.json
            git commit -m "Weekly exam outline check $DAY"
            git push -u origin "$BRANCH"
            gh pr create --base main --head "$BRANCH" --title "Weekly exam outline check $DAY" \
              --body "The weekly check of Microsoft's DP-600 and PL-300 outlines. If an issue was opened too, the questions need a review first."
            gh workflow run tests.yml --ref "$BRANCH"
            gh workflow run privacy.yml --ref "$BRANCH"
          fi

      - name: Open an issue when Microsoft changed something
        if: hashFiles('review-*.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in review-*.md; do
            [ -f "$f" ] || continue
            EXAM=$(basename "$f" .md | sed 's/^review-//' | tr '[:lower:]' '[:upper:]')
            TITLE="$EXAM: Microsoft changed the exam outline, questions need a review"
            if gh issue list --state open --search "$TITLE in:title" --json number --jq 'length' | grep -q '^0$'; then
              gh issue create --title "$TITLE" --body-file "$f"
            else
              echo "An issue for $EXAM is already open, not adding another one."
            fi
          done

      - name: Flag problems (GitHub emails you when this fails)
        if: steps.dp600.outcome == 'failure' || steps.pl300.outcome == 'failure'
        run: |
          echo "::error::An exam outline check found a change or could not read Microsoft's page. See the issue or this run's log."
          exit 1
