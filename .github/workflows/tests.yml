name: Tests

# Every push and pull request runs the website's suites and the MCP's checks, so nothing reaches main untested.
# B-145 (owner's go 18 Oct): the long runs are split into shards that run as parallel jobs; each required check
# (website, mcp, mcp-windows) is a last job of that name that needs all its shards, fails unless every one of them
# passed, and adds up their checks (scripts/ci-sum.mjs: every shard, suite and script exactly once).

# Pushes to main, every pull request (drafts included) and a manual "Run workflow" on any branch (owner 18 Oct): a branch
# without a PR gets no automatic run, so a push to a PR branch is no longer tested twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# one run per ref: refs/heads/main for pushes, refs/pull/<n>/merge for a PR, the branch for a manual run
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the sitemap test reads page dates from the git history

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Every .min.js is built from its source
        run: node scripts/check-min.mjs

      - name: The shipped code loads every module by a literal path (packaging stages only what it can name, B-196)
        run: node scripts/test-literal-requires.mjs && node scripts/check-literal-requires.mjs

      - name: Every MCP test script prints the result line CI's summary counts (B-198)
        run: node scripts/test-result-lines.mjs && node scripts/check-result-lines.mjs

      - name: The MCP CHANGELOG's [Unreleased] section is in plain words (no internal codes; users read it)
        run: node scripts/test-changelog-words.mjs && node scripts/changelog-words.mjs

      - name: The price updater reads Microsoft's page correctly (fixed text, no network)
        run: node scripts/test-powerbi-prices.mjs

      - name: The weekly Microsoft watch compares and writes its issue correctly (fixed answers, no network)
        run: node scripts/test-microsoft-watch.mjs
      - name: The PL-300 question file is what its source builds (no edit in the built file only)
        run: node scripts/pl300-bank/build.js --check

      - name: Sitemap dates skip boilerplate-only commits (git history, no network)
        run: node scripts/test-sitemap-lastmod.mjs

      - name: Every sitemap lastmod is its page's last content change (git history, B-151)
        run: node scripts/sitemap-lastmod.mjs

      - name: IndexNow sends the right pages, and the key file is in place (no network)
        run: node scripts/test-indexnow.mjs

      - name: The site's config files (robots, sitemap, icons, manifest, security.txt, llms.txt, every page's head)
        run: node scripts/test-site-config.mjs

      - name: Analytics events follow GA4 rules (no parameter GA4 reads as the traffic source)
        run: node scripts/test-analytics-events.mjs

      - name: The beta page's "What's new in 0.3.0" in English and Arabic, naming nothing outside 0.3.0
        run: node scripts/test-whats-new.mjs

  website-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]   # SHARDS in scripts/tests/run-all.mjs
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # as before the split: the suites see the same checkout

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      # (in one shard only: it renders every Arabic copy again, so once per run is enough; a failure fails the shard,
      # so the website check)
      - name: The Arabic copies at /ar/ are what a fresh render of their English pages gives (never edited by hand)
        if: matrix.shard == 1
        run: node scripts/ar-pages.mjs

      - name: Website suites, shard ${{ matrix.shard }} of 3
        run: |
          mkdir -p ci-logs
          node scripts/tests/run-all.mjs --shard ${{ matrix.shard }}/3 2>&1 | tee ci-logs/suites-${{ matrix.shard }}.log

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: website-suites-${{ matrix.shard }}
          path: ci-logs/
          if-no-files-found: error
          retention-days: 7

  website:
    needs: [website-checks, website-suites]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every shard passed (a failed, cancelled or skipped one fails this check)
        run: |
          echo "website-checks: ${{ needs.website-checks.result }}"; test "${{ needs.website-checks.result }}" = success
          echo "website-suites: ${{ needs.website-suites.result }}"; test "${{ needs.website-suites.result }}" = success

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: website-suites-*
          path: ci-logs
          merge-multiple: true

      - name: Every part ran exactly once; the checks added up
        run: node scripts/ci-sum.mjs website ci-logs

  mcp-parts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 0: npm test's other scripts (test.mjs says SKIP); 1-4: test.mjs's parts (SHARDS in mcp/test.mjs)
        shard: [0, 1, 2, 3, 4]
    defaults:
      run:
        shell: bash
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install
        run: npm ci

      - name: MCP checks, shard ${{ matrix.shard }} of 4
        env:
          DA_SHARD: ${{ matrix.shard }}/4
        run: |
          mkdir -p ../ci-logs
          if [ "$DA_SHARD" = 0/4 ]; then npm test 2>&1 | tee ../ci-logs/mcp-shard-0.log; else node test.mjs 2>&1 | tee "../ci-logs/mcp-shard-${{ matrix.shard }}.log"; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mcp-parts-${{ matrix.shard }}
          path: ci-logs/
          if-no-files-found: error
          retention-days: 7

  mcp:
    needs: [mcp-parts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every shard passed (a failed, cancelled or skipped one fails this check)
        run: |
          echo "mcp-parts: ${{ needs.mcp-parts.result }}"; test "${{ needs.mcp-parts.result }}" = success

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mcp-parts-*
          path: ci-logs
          merge-multiple: true

      - name: Every part ran exactly once; the checks added up
        run: node scripts/ci-sum.mjs mcp ci-logs

  # The users and the validation laptop run Windows; several past bugs were Windows-only (file URLs, paths, locks).
  # Blocking since it was green on main (owner 11 Oct: "Windows in CI"; outside review Z-11: a release needs it green).
  # 40, like the website job: the suite takes 15-20 min on GitHub's Windows runners and one run on main hit the old
  # limit of 25 (16 Oct, 273fd90: stopped at 25:08, shown as cancelled, no test failed); kept for each shard
  mcp-windows-parts:
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # 0: npm test's other scripts (test.mjs says SKIP); 1-4: test.mjs's parts (SHARDS in mcp/test.mjs)
        shard: [0, 1, 2, 3, 4]
    defaults:
      run:
        shell: bash
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install
        run: npm ci

      - name: MCP checks on Windows, shard ${{ matrix.shard }} of 4
        env:
          DA_SHARD: ${{ matrix.shard }}/4
        run: |
          mkdir -p ../ci-logs
          if [ "$DA_SHARD" = 0/4 ]; then npm test 2>&1 | tee ../ci-logs/mcp-shard-0.log; else node test.mjs 2>&1 | tee "../ci-logs/mcp-shard-${{ matrix.shard }}.log"; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mcp-windows-parts-${{ matrix.shard }}
          path: ci-logs/
          if-no-files-found: error
          retention-days: 7

  mcp-windows:
    needs: [mcp-windows-parts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every shard passed (a failed, cancelled or skipped one fails this check)
        run: |
          echo "mcp-windows-parts: ${{ needs.mcp-windows-parts.result }}"; test "${{ needs.mcp-windows-parts.result }}" = success

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mcp-windows-parts-*
          path: ci-logs
          merge-multiple: true

      - name: Every part ran exactly once; the checks added up
        run: node scripts/ci-sum.mjs mcp ci-logs
