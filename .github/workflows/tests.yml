name: Tests

# Every push and pull request runs the website's 16 suites and the MCP's checks, so nothing reaches main untested.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Every .min.js is built from its source
        run: node scripts/check-min.mjs

      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      - name: All website suites
        run: node scripts/tests/run-all.mjs

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install
        run: npm ci

      - name: MCP checks
        run: npm test
