name: Tests

# Every push and pull request runs the website's suites and the MCP's checks, so nothing reaches main untested.
# B-145 (owner's go 18 Oct): the long runs are split into shards that run as parallel jobs; each required check
# (website, mcp, mcp-windows) is a last job of that name that needs all its shards, fails unless every one of them
# passed, and adds up their checks (scripts/ci-sum.mjs: every shard, suite and script exactly once).

# Pushes to main, every pull request (drafts included) and a manual "Run workflow" on any branch (owner 18 Oct): a branch
# without a PR gets no automatic run, so a push to a PR branch is no longer tested twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# one run per ref: refs/heads/main for pushes, refs/pull/<n>/merge for a PR, the branch for a manual run
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the sitemap test reads page dates from the git history

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # (Q1, 0.3.1) bugs only (eslint.config.mjs: no-undef, unused variables, unreachable code, duplicate keys ...), no style
      - name: Lint the MCP and the site's engines for bugs (ESLint, pinned in package.json)
        run: npm run lint

      - name: Every .min.js is built from its source
        run: node scripts/check-min.mjs

      - name: The shipped code loads every module by a literal path (packaging stages only what it can name, B-196)
        run: node scripts/test-literal-requires.mjs && node scripts/check-literal-requires.mjs

      - name: Every MCP test script prints the result line CI's summary counts (B-198)
        run: node scripts/test-result-lines.mjs && node scripts/check-result-lines.mjs

      # (A1, 0.3.1) what a new session reads first stays small: caps, job summaries, links and the task routes resolve
      - name: The agent's startup pack within its caps; every link and task route resolves
        run: node scripts/test-agent-memory.mjs && node scripts/check-agent-memory.mjs

      - name: The MCP CHANGELOG's [Unreleased] section is in plain words (no internal codes; users read it)
        run: node scripts/test-changelog-words.mjs && node scripts/changelog-words.mjs

      - name: The price updater reads Microsoft's page correctly (fixed text, no network)
        run: node scripts/test-powerbi-prices.mjs

      - name: The weekly Microsoft watch compares and writes its issue correctly (fixed answers, no network)
        run: node scripts/test-microsoft-watch.mjs
      - name: The PL-300 question file is what its source builds (no edit in the built file only)
        run: node scripts/pl300-bank/build.js --check

      # (A2, 0.3.1) the one result adapter: a failure as one line, causes by name, suites checked by name, --affected
      - name: Test results read one way (one-line failures, named causes, suite identities; made-up suites and logs)
        run: node scripts/test-results-adapter.mjs

      - name: Sitemap dates skip boilerplate-only commits (git history, no network)
        run: node scripts/test-sitemap-lastmod.mjs

      - name: Every sitemap lastmod is its page's last content change (git history, B-151)
        run: node scripts/sitemap-lastmod.mjs

      - name: IndexNow sends the right pages, and the key file is in place (no network)
        run: node scripts/test-indexnow.mjs

      - name: The site's config files (robots, sitemap, icons, manifest, security.txt, llms.txt, every page's head)
        run: node scripts/test-site-config.mjs

      - name: The site's Arabic uses one term per concept (the terminology sheet), the English once for slicer and tooltip
        run: node scripts/test-arabic-terms.mjs

      - name: Analytics events follow GA4 rules (no parameter GA4 reads as the traffic source)
        run: node scripts/test-analytics-events.mjs

      - name: The beta page's "What's new in 0.3.0" in English and Arabic, naming nothing outside 0.3.0
        run: node scripts/test-whats-new.mjs

  website-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]   # SHARDS in scripts/tests/run-all.mjs
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # as before the split: the suites see the same checkout

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      # (in one shard only: it renders every Arabic copy again, so once per run is enough; a failure fails the shard,
      # so the website check)
      - name: The Arabic copies at /ar/ are what a fresh render of their English pages gives (never edited by hand)
        if: matrix.shard == 1
        run: node scripts/ar-pages.mjs

      - name: Website suites, shard ${{ matrix.shard }} of 3
        run: |
          mkdir -p ci-logs
          node scripts/tests/run-all.mjs --shard ${{ matrix.shard }}/3 --log-dir ci-logs/suites-${{ matrix.shard }}-full 2>&1 | tee ci-logs/suites-${{ matrix.shard }}.log

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: website-suites-${{ matrix.shard }}
          path: ci-logs/
          if-no-files-found: error
          retention-days: 7

  website:
    needs: [website-checks, website-suites]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every shard passed (a failed, cancelled or skipped one fails this check)
        run: |
          echo "website-checks: ${{ needs.website-checks.result }}"; test "${{ needs.website-checks.result }}" = success
          echo "website-suites: ${{ needs.website-suites.result }}"; test "${{ needs.website-suites.result }}" = success

      # (0.3.1) the steps below run after a failed shard too, so ci-sum names the failing script (an annotation)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: always()

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: always()
        with:
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: always()
        with:
          pattern: website-suites-*
          path: ci-logs
          merge-multiple: true

      - name: Every part ran exactly once; the checks added up
        if: always()
        run: node scripts/ci-sum.mjs website ci-logs --os linux

  mcp-parts:
    runs-on: ubuntu-latest
    timeout-minutes: 40   # as the Windows and macOS shards: shard 0 runs every mcp/tests.json suite (12.7 min on 27 Oct)
    strategy:
      fail-fast: false
      matrix:
        # 0: npm test's other scripts, mcp/tests.json's suites (test.mjs says SKIP; --keep-going: every suite runs); 1-4: test.mjs's parts (SHARDS in mcp/test.mjs), through the same runner
        shard: [0, 1, 2, 3, 4]
    defaults:
      run:
        shell: bash
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # suites read old versions of files from git history (glass-tables: the base engine)

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install
        run: npm ci

      # (A2, 0.3.1) every shard through npm test's runner: the console (this log) has the result lines and, for a failure,
      # one line first and 4 KB of detail; each suite's full output is in mcp-shard-<k>-full/ (the artifact). Shard 0:
      # mcp/tests.json's suites, test.mjs says SKIP; shards 1-4: test.mjs's part k only. A suite still running after
      # DA_SUITE_TIMEOUT seconds fails as "timeout" before the job's own limit cancels it unnamed.
      - name: MCP checks, shard ${{ matrix.shard }} of 4
        env:
          DA_SHARD: ${{ matrix.shard }}/4
          DA_SUITE_TIMEOUT: 780
        run: |
          mkdir -p ../ci-logs
          npm test -- --keep-going --log-dir "../ci-logs/mcp-shard-${{ matrix.shard }}-full" 2>&1 | tee "../ci-logs/mcp-shard-${{ matrix.shard }}.log"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mcp-parts-${{ matrix.shard }}
          path: ci-logs/
          if-no-files-found: error
          retention-days: 7

  mcp:
    needs: [mcp-parts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every shard passed (a failed, cancelled or skipped one fails this check)
        run: |
          echo "mcp-parts: ${{ needs.mcp-parts.result }}"; test "${{ needs.mcp-parts.result }}" = success

      # (0.3.1) the steps below run after a failed shard too, so ci-sum names the failing script (an annotation)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: always()

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: always()
        with:
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: always()
        with:
          pattern: mcp-parts-*
          path: ci-logs
          merge-multiple: true

      - name: Every part ran exactly once; the checks added up
        if: always()
        run: node scripts/ci-sum.mjs mcp ci-logs --os linux

  # (Q1, 0.3.1; the owner 25 Oct, after an outside review: "coverage reporting to identify untested branches") the MCP's
  # npm test once under c8 (pinned in the root package.json; .c8rc.json: mcp/server.mjs, lib, tools and the engines in
  # assets/js), per file lines and branches % in the job summary and an artifact. Not a gate in 0.3.1: no threshold, no
  # required check needs it, and a failing suite here is reported by the mcp check, not this job.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # suites read old versions of files from git history (glass-tables: the base engine)

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json

      - name: Install
        run: npm ci && (cd mcp && npm ci)

      - name: The MCP's npm test under c8
        run: |
          mkdir -p ci-logs
          npm run coverage:mcp > ci-logs/coverage-run.log 2>&1 || echo "npm test exit $? under c8 (the mcp check reports the failure)" | tee -a ci-logs/coverage-run.log
          tail -5 ci-logs/coverage-run.log

      - name: Lines and branches per file (job summary)
        if: always()
        run: |
          node scripts/coverage-summary.mjs > ci-logs/coverage-summary.md
          cat ci-logs/coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
          cp coverage/coverage-summary.json ci-logs/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: ci-logs/
          if-no-files-found: error
          retention-days: 14

  # (SQ15c, Q1-S5; the owner 26 Oct, "Yes, fix now") the website suites' coverage of the engines (assets/js/*.js, their
  # source): every suite once in Chromium with page.coverage (scripts/tests/lib.mjs, DA_WEB_COVERAGE), c8 reports it
  # (scripts/coverage-web.mjs). A report like the coverage job above, never a gate: continue-on-error, no required check
  # needs it, and a failing suite here is reported by the website-suites jobs, not this one. One line in the log; the
  # per-file table in the job summary; coverage/web/ as the artifact.
  coverage-web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # as the website-suites jobs: the suites see the same checkout

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      - name: The website suites with Chromium's coverage
        run: |
          npm run coverage:web
          cat coverage/web/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-web
          path: coverage/web/
          if-no-files-found: error
          retention-days: 14

  # The users and the validation laptop run Windows; several past bugs were Windows-only (file URLs, paths, locks).
  # Blocking since it was green on main (owner 11 Oct: "Windows in CI"; outside review Z-11: a release needs it green).
  # 40, like the website job: the suite takes 15-20 min on GitHub's Windows runners and one run on main hit the old
  # limit of 25 (16 Oct, 273fd90: stopped at 25:08, shown as cancelled, no test failed); kept for each shard
  mcp-windows-parts:
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # 0: npm test's other scripts, mcp/tests.json's suites (test.mjs says SKIP; --keep-going: every suite runs); 1-4: test.mjs's parts (SHARDS in mcp/test.mjs), through the same runner
        shard: [0, 1, 2, 3, 4]
    defaults:
      run:
        shell: bash
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # suites read old versions of files from git history (glass-tables: the base engine)

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install
        run: npm ci

      - name: MCP checks on Windows, shard ${{ matrix.shard }} of 4
        env:
          DA_SHARD: ${{ matrix.shard }}/4
          DA_SUITE_TIMEOUT: 2100
        run: |
          mkdir -p ../ci-logs
          npm test -- --keep-going --log-dir "../ci-logs/mcp-shard-${{ matrix.shard }}-full" 2>&1 | tee "../ci-logs/mcp-shard-${{ matrix.shard }}.log"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mcp-windows-parts-${{ matrix.shard }}
          path: ci-logs/
          if-no-files-found: error
          retention-days: 7

  mcp-windows:
    needs: [mcp-windows-parts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every shard passed (a failed, cancelled or skipped one fails this check)
        run: |
          echo "mcp-windows-parts: ${{ needs.mcp-windows-parts.result }}"; test "${{ needs.mcp-windows-parts.result }}" = success

      # (0.3.1) the steps below run after a failed shard too, so ci-sum names the failing script (an annotation)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: always()

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: always()
        with:
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: always()
        with:
          pattern: mcp-windows-parts-*
          path: ci-logs
          merge-multiple: true

      - name: Every part ran exactly once; the checks added up
        if: always()
        run: node scripts/ci-sum.mjs mcp ci-logs --os windows

  # macOS (0.3.1 P1, the owner 25 Oct: "beyond Windows, without shipping it"): DataArcus writes Power BI projects on
  # macOS and Linux too (opened in Power BI Desktop on Windows, or deployed to Fabric). The same parts as mcp and
  # mcp-windows, so a path or file-system difference (APFS's one folder for NFC and NFD names, /var a link to
  # /private/var) shows here; test-platform-paths.mjs is the test written for those. Not a required check until the
  # owner makes it one; the .mcpb keeps "win32" until one real Mac run by a person (the engine's PACKAGING.md).
  mcp-macos-parts:
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # 0: npm test's other scripts, mcp/tests.json's suites (test.mjs says SKIP; --keep-going: every suite runs); 1-4: test.mjs's parts (SHARDS in mcp/test.mjs), through the same runner
        shard: [0, 1, 2, 3, 4]
    defaults:
      run:
        shell: bash
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # suites read old versions of files from git history (glass-tables: the base engine)

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install
        run: npm ci

      - name: MCP checks on macOS, shard ${{ matrix.shard }} of 4
        env:
          DA_SHARD: ${{ matrix.shard }}/4
          DA_SUITE_TIMEOUT: 2100
        run: |
          mkdir -p ../ci-logs
          npm test -- --keep-going --log-dir "../ci-logs/mcp-shard-${{ matrix.shard }}-full" 2>&1 | tee "../ci-logs/mcp-shard-${{ matrix.shard }}.log"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mcp-macos-parts-${{ matrix.shard }}
          path: ci-logs/
          if-no-files-found: error
          retention-days: 7

  mcp-macos:
    needs: [mcp-macos-parts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every shard passed (a failed, cancelled or skipped one fails this check)
        run: |
          echo "mcp-macos-parts: ${{ needs.mcp-macos-parts.result }}"; test "${{ needs.mcp-macos-parts.result }}" = success

      # (0.3.1) the steps below run after a failed shard too, so ci-sum names the failing script (an annotation)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: always()

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: always()
        with:
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: always()
        with:
          pattern: mcp-macos-parts-*
          path: ci-logs
          merge-multiple: true

      - name: Every part ran exactly once; the checks added up
        if: always()
        run: node scripts/ci-sum.mjs mcp ci-logs --os macos
