name: Privacy scan

# The owner's first rule: no employer data anywhere, and no secrets. Every push and pull request is checked for
# words from the private deny list (the DENY_TERMS secret; matches are reported by number, never by the word)
# and for secrets in the whole history (gitleaks, pinned and checksummed).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: The deny-list scan's own checks (made-up words)
        run: node scripts/test-deny-scan.mjs

      - name: No word from the private deny list (every file and path; each new commit's message, added lines and paths)
        env:
          DENY_TERMS: ${{ secrets.DENY_TERMS }}
          DENY_RANGE: ${{ github.event_name == 'push' && format('{0}..{1}', github.event.before, github.sha) || (github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha)) || '' }}
        run: node scripts/deny-scan.mjs .

      - name: No secrets in the history (gitleaks 8.21.2)
        run: |
          curl -sSL -o "$RUNNER_TEMP/gl.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  $RUNNER_TEMP/gl.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gl.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --no-banner --redact --config .gitleaks.toml
